services:
  - type: worker
    name: medes-et-bayse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot/agent.py
    envVars:
      - key: BAYSE_PUBLIC_KEY
        sync: false
      - key: BAYSE_SECRET_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "6433282551"
      - key: DATABASE_PATH
        value: /data/medes.db
      - key: DRY_RUN
        value: "true"
      - key: BANKROLL
        value: "100.0"
      - key: MIN_EDGE
        value: "0.03"
      - key: MAX_POSITION_FRACTION
        value: "0.05"
      - key: CYCLE_INTERVAL_SECONDS
        value: "300"
    disk:
      name: medes-data
      mountPath: /data
      sizeGB: 1
